name: CI Tests

on:
  push: {}
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run tests
        run: |
          mkdir -p reports
          pytest --html=reports/report.html --self-contained-html || true

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/report.html

      - name: Install jq
        run: sudo apt-get install jq   

      - name: Send report to Slack
        if: always()
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: |
          if [ -f reports/report.html ]; then
            # 1. Obtener una URL de subida externa
            UPLOAD_URL=$(curl -X POST -H "Authorization: Bearer $SLACK_TOKEN" \
              -F "filename=report.html" \
              -F "length=$(stat -c%s reports/report.html)" \
              https://slack.com/api/files.getUploadURLExternal | jq -r '.upload_url')

            # 2. Subir el archivo a esa URL
            curl -F file=@reports/report.html "$UPLOAD_URL"

            # 3. Finalizar la subida y compartir en el canal
            FILE_ID=$(curl -X POST -H "Authorization: Bearer $SLACK_TOKEN" \
              -F "file=$UPLOAD_URL" \
              -F "channels=$SLACK_CHANNEL" \
              https://slack.com/api/files.completeUploadExternal | jq -r '.files[0].id')
            
            echo "Archivo subido con ID: $FILE_ID"
          else
            echo "No report found"
          fi
